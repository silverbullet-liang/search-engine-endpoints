(function () {
  "use strict";

  var view = document.getElementById("view");
  var navEl = document.getElementById("nav");
  var qEl = document.getElementById("q");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- 侧栏 ---------- */
  function buildNav() {
    var html = "";
    NAV.forEach(function (g) {
      html += '<div class="grp">' + esc(g.group) + "</div>";
      g.items.forEach(function (it) {
        html += '<a class="item" href="#/' + it.id + '" data-id="' + it.id + '">' +
          '<span class="dot ' + (it.status || "") + '"></span>' +
          '<span class="lbl">' + esc(it.label) + "</span></a>";
      });
    });
    navEl.innerHTML = html;
  }

  function markCurrent(id) {
    [].forEach.call(navEl.querySelectorAll(".item"), function (a) {
      if (a.dataset.id === id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  /* ---------- 片段 ---------- */
  function section(title, inner) {
    return '<section class="blk"><h2><span class="num">00</span>' + title + "</h2>" + inner + "</section>";
  }

  function codeBlock(tag, text) {
    return '<div class="code"><div class="code-bar"><span class="tag">' + esc(tag) +
      '</span><span class="spacer"></span><button class="copy" data-copy>复制</button></div>' +
      "<pre>" + esc(text) + "</pre></div>";
  }

  function paramTable(rows) {
    var body = rows.map(function (r) {
      return "<tr><td><code>" + esc(r[0]) + "</code></td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>";
    }).join("");
    return '<div class="tw"><table><tr><th>参数</th><th>必填</th><th>说明</th></tr>' + body + "</table></div>";
  }

  function chips(meta) {
    return '<div class="meta">' + meta.map(function (m) {
      return '<span class="chip ' + (m.l || "") + '"><span class="dot"></span>' + esc(m.t) + "</span>";
    }).join("") + "</div>";
  }

  /* ---------- 渲染 ---------- */
  function render(id) {
    var d = DOCS[id] || DOCS.overview;
    var out = [];

    out.push("<h1>" + esc(d.title) + "</h1>");
    if (d.sub) out.push('<p class="sub">' + d.sub + "</p>");

    var meta = (d.meta || []).slice();
    if (d.status) meta.unshift({ l: d.status.l, t: d.status.t });
    if (meta.length) out.push(chips(meta));

    if (d.url) {
      out.push('<div class="ep"><span class="verb">' + esc(d.method) + "</span>" +
        '<span class="path">' + esc(d.url) + "</span></div>");
    }

    if (d.params) out.push(section("参数", paramTable(d.params)));
    if (d.custom) out.push(d.custom);
    if (d.headers) out.push(section("请求头", codeBlock("http", d.headers)));
    if (d.curl) out.push(section("请求示例", codeBlock("bash", d.curl)));
    if (d.response) out.push(section("返回示例", codeBlock(d.responseTag || "响应", d.response)));
    if (d.extra) out.push(d.extra);
    if (d.notes && d.notes.length) {
      out.push(section("说明与限制", "<ul>" + d.notes.map(function (n) {
        return "<li>" + n + "</li>";
      }).join("") + "</ul>"));
    }
    if (d.compliance) out.push(section("合规状态", "<p>" + d.compliance + "</p>"));
    if (d.src) {
      out.push('<p class="hint">完整实验数据与更多细节：<a href="' + REPO + "/blob/main/" + d.src +
        '" target="_blank" rel="noopener">' + d.src + "</a></p>");
    }

    view.innerHTML = out.join("");

    // 统一给 h2 编号（数据里写死的编号会被覆盖，避免插入/删除后错位）
    [].forEach.call(view.querySelectorAll("h2 > .num"), function (n, i) {
      n.textContent = ("0" + (i + 1)).slice(-2);
    });

    document.getElementById("crumb-grp").textContent = d.group || "概览";
    document.getElementById("crumb-lbl").textContent = d.label || "总览";
    document.title = d.title + " · search-engine-endpoints";

    markCurrent(id);
    document.body.classList.remove("nav-open");
    document.getElementById("menu").setAttribute("aria-expanded", "false");
  }

  /* ---------- 路由 ---------- */
  function route() {
    var id = (location.hash.replace(/^#\/?/, "") || "overview").trim();
    render(id);
    window.scrollTo(0, 0);
    view.focus({ preventScroll: true });
  }

  /* ---------- 复制 ---------- */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-copy]");
    if (!btn) return;
    var pre = btn.closest(".code").querySelector("pre");
    var text = pre ? pre.textContent : "";
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已复制";
      btn.classList.add("done");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("done"); }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
  });

  /* ---------- 侧栏筛选 ---------- */
  qEl.addEventListener("input", function () {
    var q = qEl.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(navEl.querySelectorAll(".item"), function (a) {
      var hit = !q || a.textContent.toLowerCase().indexOf(q) >= 0;
      a.style.display = hit ? "" : "none";
      if (hit) shown++;
    });
    [].forEach.call(navEl.querySelectorAll(".grp"), function (g) {
      var any = false, n = g.nextElementSibling;
      while (n && !n.classList.contains("grp")) {
        if (n.classList && n.classList.contains("item") && n.style.display !== "none") { any = true; break; }
        n = n.nextElementSibling;
      }
      g.style.display = any ? "" : "none";
    });
    if (!shown && q) navEl.setAttribute("data-empty", "1");
    else navEl.removeAttribute("data-empty");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if (e.key === "Escape" && document.activeElement === qEl) { qEl.value = ""; qEl.dispatchEvent(new Event("input")); qEl.blur(); }
    if (e.key === "Escape") {
      document.body.classList.remove("nav-open");
      document.getElementById("menu").setAttribute("aria-expanded", "false");
    }
  });

  /* ---------- 主题 ---------- */
  var themeBtn = document.getElementById("theme");
  var saved = null;
  try { saved = localStorage.getItem("see-theme"); } catch (err) {}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("see-theme", next); } catch (err) {}
  });

  /* ---------- 移动端 ---------- */
  document.getElementById("menu").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("scrim").addEventListener("click", function () {
    document.body.classList.remove("nav-open");
    document.getElementById("menu").setAttribute("aria-expanded", "false");
  });

  window.addEventListener("hashchange", route);

  buildNav();
  route();
})();
</script>
</body>
</html>
